{{- if .Values.mlBackend.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sharp.mlBackend.name" . }}
  labels:
    {{- include "sharp.labels" . | nindent 4 }}
    {{- include "sharp.selector" (dict "name" (include "sharp.mlBackend.name" .) "root" .) | nindent 4 }}
{{- end }}
