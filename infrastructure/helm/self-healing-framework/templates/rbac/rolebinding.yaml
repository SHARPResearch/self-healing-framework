{{- if .Values.executor.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "self-healing-framework.fullname" . }}-executor
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "self-healing-framework.fullname" . }}-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "self-healing-framework.fullname" . }}-executor
    namespace: {{ .Release.Namespace }}
{{- end }}