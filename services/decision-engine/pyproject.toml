[project]
name = "decision-engine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "networkx>=3.3",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "neo4j>=5.26.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "aiosmtplib>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
