[project]
name = "ml-backend"
version = "0.1.0"
description = "Telemetry scoring, dynamic model updating (CADAL) and model registry API for the self-healing framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "redis>=5.0",
    # ml-pipeline (imported from ../../ml-pipeline, see app/core/pipeline_path.py). Pinned to
    # ml-pipeline/uv.lock so the backend runs exactly what the evaluation measured.
    "river==0.25.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
